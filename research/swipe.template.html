<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaurav Sood - Swipe Through the Research</title>
<meta name="description" content="Papers, software, and data by Gaurav Sood, one card at a time.">
<link rel="canonical" href="https://gsood.com/research/">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#111">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16161a;
  --muted: #5b5b66;
  --paper: #fbfaf7;
  --line: #e3e0d8;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: #111;
  color: var(--ink);
  font: 400 1rem/1.55 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

.top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: max(0.6rem, env(safe-area-inset-top)) 0.75rem 0.6rem;
  background: #111;
  color: #fff;
}
.home {
  flex: none;
  font-weight: 700;
  text-decoration: none;
  font-size: 1.05rem;
}
.home span { color: #6cb4ff; }
.chips {
  position: relative;
  flex: 1;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 0.6rem, #000 calc(100% - 1.5rem), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 0.6rem, #000 calc(100% - 1.5rem), transparent);
  padding: 0 0.6rem;
}
.chips::-webkit-scrollbar { display: none; }
.chips a {
  flex: none;
  padding: 0.3rem 0.7rem;
  border-radius: 999px;
  border: 1px solid hsl(var(--hue) 60% 60% / 0.5);
  font-size: 0.8rem;
  text-decoration: none;
  white-space: nowrap;
  color: #ddd;
  transition: background 0.2s, color 0.2s;
}
.chips a[aria-current="true"] {
  background: hsl(var(--hue) 70% 62%);
  border-color: transparent;
  color: #111;
  font-weight: 500;
}

.feed {
  flex: 1;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
  outline: none;
}
.card, .end {
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 0.75rem;
}
.card-inner, .end-inner {
  margin: auto;
  width: 100%;
  max-width: 34rem;
  padding: 1.6rem 1.4rem 1.4rem;
  background: var(--paper);
  border-radius: 1.4rem;
  border-top: 0.45rem solid hsl(var(--hue) 70% 58%);
  box-shadow: 0 1.5rem 3rem -1.5rem hsl(var(--hue) 70% 40% / 0.6);
}
.where {
  margin: 0 0 0.9rem;
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.where .sub { white-space: nowrap; }
.kind {
  display: inline-block;
  margin-right: 0.35rem;
  padding: 0.05rem 0.5rem;
  border-radius: 999px;
  background: hsl(var(--hue) 70% 92%);
  color: hsl(var(--hue) 60% 28%);
  font-weight: 500;
  text-transform: uppercase;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
}

.summary { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }
.summary > .entry-icon:first-child {
  display: block;
  font-size: 2.6rem;
  line-height: 1;
  margin-bottom: 0.5rem;
}
.summary a {
  display: inline-block;
  margin: 0.15rem 0;
  padding: 0.15rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
  font-size: 0.85rem;
  line-height: 1.5;
}
.summary > a.entry-title {
  display: block;
  margin-bottom: 0.35rem;
  font-size: clamp(1.3rem, 5.5vw, 1.65rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-top: 0;
  padding: 0;
  border: 0;
  background: none;
}
.summary > a.entry-title + br { display: none; }
.summary .entry-icon { margin-right: 0.3rem; }
.summary .supporting-row { display: block; margin-top: 0.4rem; }
.summary .supporting-label { color: #990000; }
.summary .resource-links { display: inline; }
.summary .highlight { color: #990000; font-weight: 500; }

.abstract {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 0.95rem;
  color: #2a2a30;
}
.js .card:not(.open) .abstract {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 8;
  overflow: hidden;
}
.more {
  margin-top: 0.6rem;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  color: hsl(var(--hue) 60% 35%);
  cursor: pointer;
}

.end { color: #fff; text-align: center; --hue: 210; }
.end-inner { color: var(--ink); }
.end-inner h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
.end-inner a { font-weight: 500; }

.hud {
  position: fixed;
  right: 1rem;
  bottom: max(1rem, env(safe-area-inset-bottom));
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  background: rgb(17 17 17 / 0.8);
  color: #fff;
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hint {
  display: block;
  margin-top: 1.2rem;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  animation: nudge 1.6s ease-in-out infinite;
}
@keyframes nudge { 50% { transform: translateY(-0.35rem); } }

a:focus-visible, button:focus-visible {
  outline: 2px solid #6cb4ff;
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .feed { scroll-behavior: auto; }
  .hint { animation: none; }
}
</style>
<link rel="stylesheet" href="/research/headings.css">
<link rel="stylesheet" href="/research/output-filter.css">
<script defer src="/research/recent.js"></script>
</head>
<body>
<header class="top">
  <a class="home" href="/"><span>g</span>sood</a>
  <nav class="chips" aria-label="Topics">
{{chips}}
  </nav>
</header>
{{filters}}
<main class="feed" tabindex="-1">
{{cards}}
<section class="end">
  <div class="end-inner">
    <h2>That's all <span id="end-total">{{total}}</span>.</h2>
    <p><a href="./" data-catalog-view>See everything as a list</a> or <a href="#card-1" id="start-over">start over</a>.</p>
  </div>
</section>
</main>
<p class="hud" hidden><span id="at">1</span> / <span id="of"></span></p>
<script src="/research/output-filter.js"></script>
<script>
document.documentElement.classList.add("js");
(function () {
  var feed = document.querySelector(".feed");
  var cards = Array.prototype.slice.call(document.querySelectorAll(".card:not([hidden])"));
  var chips = document.querySelector(".chips");
  var hud = document.querySelector(".hud");
  var at = document.getElementById("at");
  document.getElementById("of").textContent = cards.length;
  document.getElementById("end-total").textContent = cards.length;
  document.getElementById("start-over").hash = cards[0].id;
  for (const chip of chips.children) {
    const first = cards.find(card => card.dataset.section === chip.dataset.section);
    chip.hidden = !first;
    if (first) chip.hash = first.id;
  }
  hud.hidden = false;
  cards[0].querySelector(".card-inner").insertAdjacentHTML(
    "beforeend", '<span class="hint" aria-hidden="true">swipe up ↑</span>');

  var observer = new IntersectionObserver(function (seen) {
    seen.forEach(function (item) {
      if (!item.isIntersecting) return;
      var card = item.target;
      at.textContent = cards.indexOf(card) + 1;
      Array.prototype.forEach.call(chips.children, function (chip) {
        var on = chip.dataset.section === card.dataset.section;
        chip.setAttribute("aria-current", on);
        if (on) chips.scrollTo({left: chip.offsetLeft - chips.clientWidth / 2 + chip.clientWidth / 2, behavior: "smooth"});
      });
    });
  }, {root: feed, threshold: 0.6});
  cards.forEach(function (card) { observer.observe(card); });

  function fitMore() {
    cards.forEach(function (card) {
      var text = card.querySelector(".abstract");
      card.querySelector(".more").hidden = card.classList.contains("open") || text.scrollHeight <= text.clientHeight + 1;
    });
  }
  feed.addEventListener("click", function (event) {
    if (!event.target.classList.contains("more")) return;
    event.target.closest(".card").classList.add("open");
    event.target.hidden = true;
  });
  window.addEventListener("load", fitMore);
  window.addEventListener("resize", fitMore);

  document.addEventListener("keydown", function (event) {
    var step = {ArrowDown: 1, j: 1, ArrowUp: -1, k: -1}[event.key];
    if (!step) return;
    event.preventDefault();
    feed.scrollBy({top: step * feed.clientHeight});
  });
  if (!location.search) feed.focus({preventScroll: true});
})();
</script>
</body>
</html>
