<!DOCTYPE html>
<html lang="en">
<head>
	<title>{{title}} | Gaurav Sood</title>

	<meta charset="utf-8" />
	<meta name="description" content="{{meta_description}}" />
	<link rel="canonical" href="{{canonical_url}}" />
	<meta name="distribution" content="global" />
	<meta name="copyright" content="All material on this website is copyrighted to Gaurav Sood" />
	<meta name="rating" content="General" />

<link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Raleway" rel="stylesheet">
<link href="/style.css" rel="stylesheet" type="text/css">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1D4ED8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{meta_tags}}
<script type="application/ld+json">
{{schema}}
</script>
<link rel="stylesheet" href="/research/headings.css">
<script defer src="/research/recent.js"></script>
</head>

<body bgcolor="#ffffff" background="/images/bg.gif" topmargin="0" leftmargin="0" rightmargin="0">

<div class="container study-layout">
{{study_nav}}
  <main class="content">
    <article id="research" class="entry-page">
      {{breadcrumb}}
{{entry_body}}
    </article>
  </main>
</div>
<script>
document.addEventListener("click", function (event) {
  var btn = event.target.closest(".copy-btn");
  if (!btn) return;
  var pre = btn.closest(".citation-section").querySelector("pre");
  if (!pre || !navigator.clipboard) return;
  navigator.clipboard.writeText(pre.textContent).then(function () {
    var orig = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = orig; }, 1500);
  });
});
</script>
</body>
</html>
